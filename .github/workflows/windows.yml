name: Windows build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build and check fixtures
        shell: pwsh
        run: ./Test.ps1
      - name: Package portable application
        shell: pwsh
        run: ./Publish.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: TokNotch-Windows-win-x64
          path: artifacts/TokNotch-Windows-win-x64.zip
